name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Frozen install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code bun.lock

  quality:
    name: Format, lint, typecheck, test, audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run audit

  migrations:
    name: Migration replay
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run migrations:check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset --yes
      - run: bun run test:db

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: install
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci
      JOB_SECRET: ci-job-secret-must-be-at-least-32-chars
      APP_URL: https://example.com
      PAYMENTS_ENV: sandbox
      VITE_PAYMENTS_ENV: sandbox
      STRIPE_SANDBOX_API_KEY: ci_sandbox_stripe_connection
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ci_sandbox_webhook_secret
      LOVABLE_API_KEY: ci_lovable_api_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: install
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci
      JOB_SECRET: ci-job-secret-must-be-at-least-32-chars
      APP_URL: https://example.com
      PAYMENTS_ENV: sandbox
      VITE_PAYMENTS_ENV: sandbox
      STRIPE_SANDBOX_API_KEY: ci_sandbox_stripe_connection
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ci_sandbox_webhook_secret
      LOVABLE_API_KEY: ci_lovable_api_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
